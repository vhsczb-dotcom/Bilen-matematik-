<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Öykü Matematik - LGS Hazırlık</title>
<link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #222;
    }

    .kutu {
      max-width: 760px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 34px;
    }

    h2 {
      margin-top: 10px;
    }

    p {
      font-size: 18px;
    }

    .butonlar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-top: 25px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 18px;
      font-size: 19px;
      cursor: pointer;
    }

    .sinif {
      background: #e8eefc;
    }

    .mod {
      background: #eef8ee;
    }

    .cevap {
      background: #f1f1f1;
    }

    .geri {
      background: #e5e5e5;
      margin-top: 20px;
    }

    .tekrar {
      background: #e8eefc;
      margin-top: 20px;
    }

    #soru {
      font-size: 27px;
      margin: 25px 0;
      font-weight: bold;
    }

    #sonuc {
      min-height: 35px;
      font-size: 21px;
      font-weight: bold;
      margin-top: 18px;
    }

    #puan {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .bilgi {
      margin-top: 10px;
      font-size: 16px;
      color: #555;
    }

    .gizli {
      display: none;
    }
  </style>
</head>

<body>

  <div class="kutu">

    <h1>📘 Öykü Matematik</h1>
    <p>LGS yolunda sınıfını seç ve çalışmaya başla.</p>

    <div id="sinifEkrani">
      <h2>Sınıfını Seç</h2>

      <div class="butonlar">
        <button class="sinif" onclick="sinifSec(6)">6. Sınıf</button>
        <button class="sinif" onclick="sinifSec(7)">7. Sınıf</button>
        <button class="sinif" onclick="sinifSec(8)">8. Sınıf / LGS</button>
      </div>
    </div>
<div id="konuEkrani6" class="gizli">
  <h2>6. Sınıf Matematik Konuları</h2>

  <div class="butonlar">
    <button class="Sinif" onclick="konuSec6('sayilar1')">
      Sayılar ve Nicelikler - 1
    </button>

    <button class="Sinif" onclick="konuSec6('sayilar2')">
      Sayılar ve Nicelikler - 2
    </button>

    <button class="Sinif" onclick="konuSec6('cebir')">
      İşlemlerle Cebirsel Düşünme ve Değişimler
    </button>

    <button class="Sinif" onclick="konuSec6('geometrikSekiller')">
      Geometrik Şekiller
    </button>

    <button class="Sinif" onclick="konuSec6('geometrikNicelikler')">
      Geometrik Nicelikler
    </button>

    <button class="Sinif" onclick="konuSec6('istatistik')">
      İstatistiksel Araştırma Süreci
    </button>

    <button class="Sinif" onclick="konuSec6('olasilik')">
      Veriden Olasılığa
    </button>
  </div>

  <button class="geri" onclick="anaMenu()">
    ← Sınıf Seçimine Dön
  </button>
</div>
    <div id="modEkrani" class="gizli">
      <h2 id="sinifBaslik"></h2>

      <div class="butonlar">
        <button class="mod" onclick="testBaslat('konu')">Konu Testi</button>
        <button class="mod" onclick="testBaslat('karisik')">Karışık Test</button>
        <button id="lgsButon" class="mod gizli" onclick="testBaslat('lgs')">
          LGS Denemesi
        </button>
      </div>

      <button class="geri" onclick="anaMenu()">← Sınıf Seçimine Dön</button>
    </div>

    <div id="testEkrani" class="gizli">
      <div class="bilgi" id="testBilgi"></div>
      <div id="soru"></div>
      <div id="secenekler" class="butonlar"></div>
      <div id="sonuc"></div>
      <div id="puan">Puan: 0</div>

      <button class="geri" onclick="modMenu()">← Menüye Dön</button>
    </div>

    <div id="bitisEkrani" class="gizli">
      <h2>🎉 Test Bitti!</h2>
      <p id="finalPuan"></p>

      <button class="tekrar" onclick="yenidenBaslat()">Tekrar Başla</button>
      <button class="geri" onclick="modMenu()">Test Menüsüne Dön</button>
    </div>

  </div>

<script>
  let secilenSinif = null;
  let secilenKonu = null;
  let secilenMod = null;
  let aktifSorular = [];
  let soruNo = 0;
  let puan = 0;

  const soruBankasi = {
    6: [
      {
        soru: "48 ÷ 6 işleminin sonucu kaçtır?",
        secenekler: ["6", "7", "8", "9"],
        cevap: "8"
      },
      {
        soru: "3 × (5 + 2) işleminin sonucu kaçtır?",
        secenekler: ["18", "21", "24", "30"],
        cevap: "21"
      },
      {
        soru: "Bir sayının 4 katı 36 ise bu sayı kaçtır?",
        secenekler: ["7", "8", "9", "10"],
        cevap: "9"
      },
      {
        soru: "0,5 + 1,25 işleminin sonucu kaçtır?",
        secenekler: ["1,50", "1,65", "1,75", "2,00"],
        cevap: "1,75"
      },
      {
        soru: "3/4 kesrine denk olan kesir hangisidir?",
        secenekler: ["6/8", "4/8", "5/8", "7/8"],
        cevap: "6/8"
      }
    ],

    7: [
      {
        soru: "-6 + 9 işleminin sonucu kaçtır?",
        secenekler: ["-15", "-3", "3", "15"],
        cevap: "3"
      },
      {
        soru: "2x + 5 = 17 olduğuna göre x kaçtır?",
        secenekler: ["4", "5", "6", "7"],
        cevap: "6"
      },
      {
        soru: "Bir ürün 200 TL iken %10 indirim yapılırsa yeni fiyat kaç TL olur?",
        secenekler: ["160", "170", "180", "190"],
        cevap: "180"
      },
      {
        soru: "3² + 4² işleminin sonucu kaçtır?",
        secenekler: ["12", "18", "25", "49"],
        cevap: "25"
      },
      {
        soru: "5a - 2a işleminin sonucu hangisidir?",
        secenekler: ["2a", "3a", "5a", "7a"],
        cevap: "3a"
      }
    ],

    8: [
      {
        soru: "√81 sayısının değeri kaçtır?",
        secenekler: ["7", "8", "9", "10"],
        cevap: "9"
      },
      {
        soru: "2³ × 2² işleminin sonucu kaçtır?",
        secenekler: ["16", "24", "32", "64"],
        cevap: "32"
      },
      {
        soru: "3x - 4 = 17 olduğuna göre x kaçtır?",
        secenekler: ["5", "6", "7", "8"],
        cevap: "7"
      },
      {
        soru: "Bir dik üçgende dik kenarlar 6 cm ve 8 cm ise hipotenüs kaç cm'dir?",
        secenekler: ["9", "10", "12", "14"],
        cevap: "10"
      },
      {
        soru: "120 sayısının %25'i kaçtır?",
        secenekler: ["20", "25", "30", "40"],
        cevap: "30"
      }
    ]
  };

  function sinifSec(sinif) {
    secilenSinif = sinif;
if (sinif === 6) {
  document.getElementById("sinifEkrani").classList.add("gizli");
  document.getElementById("konuEkrani6").classList.remove("gizli");
  return;
}
    document.getElementById("sinifEkrani").classList.add("gizli");
    document.getElementById("modEkrani").classList.remove("gizli");

    document.getElementById("sinifBaslik").innerText =
      sinif + ". Sınıf Matematik";

    if (sinif === 8) {
      document.getElementById("lgsButon").classList.remove("gizli");
    } else {
      document.getElementById("lgsButon").classList.add("gizli");
    }
  }
function konuSec6(konu) {
  secilenKonu = konu;
  document.getElementById("konuEkrani6").classList.add("gizli");
  document.getElementById("modEkrani").classList.remove("gizli");

  const konuAdlari = {
    sayilar1: "Sayılar ve Nicelikler - 1",
    sayilar2: "Sayılar ve Nicelikler - 2",
    cebir: "İşlemlerle Cebirsel Düşünme ve Değişimler",
    geometrikSekiller: "Geometrik Şekiller",
    geometrikNicelikler: "Geometrik Nicelikler",
    istatistik: "İstatistiksel Araştırma Süreci",
    olasilik: "Veriden Olasılığa"
  };

  document.getElementById("sinifBaslik").innerText =
    "6. Sınıf - " + konuAdlari[konu];
}
  function testBaslat(mod) {
    secilenMod = mod;
    soruNo = 0;
    puan = 0;

    aktifSorular = [...soruBankasi[secilenSinif]];

    if (mod === "karisik" || mod === "lgs") {
      aktifSorular.sort(() => Math.random() - 0.5);
    }

    document.getElementById("modEkrani").classList.add("gizli");
    document.getElementById("bitisEkrani").classList.add("gizli");
    document.getElementById("testEkrani").classList.remove("gizli");

    let modAdi = "Konu Testi";

    if (mod === "karisik") {
      modAdi = "Karışık Test";
    }

    if (mod === "lgs") {
      modAdi = "LGS Denemesi";
    }

    document.getElementById("testBilgi").innerText =
      secilenSinif + ". Sınıf • " + modAdi;

    soruGoster();
  }

  function soruGoster() {
    const aktif = aktifSorular[soruNo];

    document.getElementById("soru").innerText =
      (soruNo + 1) + ". " + aktif.soru;

    document.getElementById("sonuc").innerText = "";

    document.getElementById("puan").innerText =
      "Puan: " + puan;

    const alan = document.getElementById("secenekler");
    alan.innerHTML = "";

    aktif.secenekler.forEach(secenek => {
      const buton = document.createElement("button");
      buton.className = "cevap";
      buton.innerText = secenek;

      buton.onclick = function() {
        cevapKontrol(secenek, buton);
      };

      alan.appendChild(buton);
    });
  }

  function cevapKontrol(secim, buton) {
    const dogru = aktifSorular[soruNo].cevap;

    const butonlar =
      document.querySelectorAll("#secenekler button");

    butonlar.forEach(b => b.disabled = true);

    if (secim === dogru) {
      puan++;
      buton.style.background = "#b8e6bd";
      document.getElementById("sonuc").innerText = "Doğru! 🎉";
    } else {
      buton.style.background = "#f3b6b6";

      document.getElementById("sonuc").innerText =
        "Yanlış. Doğru cevap: " + dogru;

      butonlar.forEach(b => {
        if (b.innerText === dogru) {
          b.style.background = "#b8e6bd";
        }
      });
    }

    document.getElementById("puan").innerText =
      "Puan: " + puan;

    setTimeout(() => {
      soruNo++;

      if (soruNo < aktifSorular.length) {
        soruGoster();
      } else {
        testiBitir();
      }
    }, 1200);
  }

  function testiBitir() {
    document.getElementById("testEkrani").classList.add("gizli");
    document.getElementById("bitisEkrani").classList.remove("gizli");

    document.getElementById("finalPuan").innerText =
      "Toplam puanın: " + puan + " / " + aktifSorular.length;
  }

  function yenidenBaslat() {
    testBaslat(secilenMod);
  }

  function modMenu() {
    document.getElementById("testEkrani").classList.add("gizli");
    document.getElementById("bitisEkrani").classList.add("gizli");
    document.getElementById("modEkrani").classList.remove("gizli");
  }

  function anaMenu() {
    document.getElementById("modEkrani").classList.add("gizli");
    document.getElementById("testEkrani").classList.add("gizli");
    document.getElementById("bitisEkrani").classList.add("gizli");
    document.getElementById("sinifEkrani").classList.remove("gizli");
  }
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js");
    });
  }
</script>

</body>
